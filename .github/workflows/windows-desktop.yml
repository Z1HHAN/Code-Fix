name: Build Windows desktop app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Prepare application-only backend and bundled Python
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B -X utf8 scripts/prepare_desktop.py --python-source "$env:pythonLocation"
          & ./desktop/build/python/python.exe -I -m pip install --no-cache-dir -r requirements-lock.txt
          python -B -X utf8 scripts/check_desktop_bundle.py --python desktop/build/python/python.exe --backend desktop/build/backend
      - name: Test and package desktop app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --no-audit --no-fund
          npm test
          npm run dist
      - name: Check packaged first launch and record identities
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/check_desktop_app.cjs desktop/dist/win-unpacked/CodeFix.exe desktop/dist/first-launch.png
          $executables = @(Get-ChildItem desktop/dist -File -Filter '*.exe')
          if ($executables.Count -ne 2) { throw 'Installer and portable exe are both required' }
          $checks = foreach ($file in $executables) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $checks | Set-Content -Encoding ascii desktop/dist/SHA256SUMS
          @("Commit: $env:GITHUB_SHA", "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", 'Platform: Windows x64', 'Model requests: none', 'Unsigned development build; teacher-machine acceptance pending') | Set-Content -Encoding utf8 desktop/dist/BUILD.txt
          Copy-Item desktop/README.md desktop/dist/README.md
          Get-Content desktop/dist/BUILD.txt >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-desktop-${{ github.sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/first-launch.png
            desktop/dist/SHA256SUMS
            desktop/dist/BUILD.txt
            desktop/dist/README.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
