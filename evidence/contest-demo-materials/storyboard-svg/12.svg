    <g font-family="Microsoft YaHei, sans-serif"><title id="t12">技术贡献与验证边界</title>
    <text x="64" y="84" font-size="38" fill="#142a49" font-weight="700" text-anchor="start">技术贡献与验证边界</text>
    <text x="65" y="205" font-size="33" fill="#165bd8" font-weight="600" text-anchor="start">证据驱动有界分支</text><text x="65" y="252" font-size="25" fill="#142a49" font-weight="400" text-anchor="start">不同失败对应不同路线，所有自动推进受上限约束</text><text x="65" y="330" font-size="33" fill="#165bd8" font-weight="600" text-anchor="start">建议与裁决分离</text><text x="65" y="377" font-size="25" fill="#142a49" font-weight="400" text-anchor="start">模型建议可回查，强制规则决定允许执行的动作</text><text x="65" y="455" font-size="33" fill="#165bd8" font-weight="600" text-anchor="start">配置与结果可追溯</text><text x="65" y="502" font-size="25" fill="#142a49" font-weight="400" text-anchor="start">指令到请求、候选到复验均保留版本和证据</text><text x="65" y="585" font-size="25" fill="#d77712" font-weight="600" text-anchor="start">已验证范围与待验项分开；后续提升以完整新批次为准</text>
    <text x="64" y="651" font-size="17" fill="#6b788b" font-weight="400" text-anchor="start">待验：全40题同版本对照、真实角色覆盖、C验收及正式录屏彩排</text>
