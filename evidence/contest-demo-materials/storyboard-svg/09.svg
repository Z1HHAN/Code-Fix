    <g font-family="Microsoft YaHei, sans-serif"><title id="t9">失败、上限与人工出口</title>
    <text x="64" y="84" font-size="38" fill="#142a49" font-weight="700" text-anchor="start">失败、上限与人工出口</text>
    <text x="70" y="210" font-size="28" fill="#d77712" font-weight="600" text-anchor="start">可恢复失败</text><path d="M345,200 L430,200" fill="none" stroke="#d77712" stroke-width="3" marker-end="url(#s9-arrowd77712)"/><text x="460" y="210" font-size="26" fill="#142a49" font-weight="400" text-anchor="start">预算允许：进入下一轮</text><path d="M830,200 L900,200" fill="none" stroke="#d77712" stroke-width="3" marker-end="url(#s9-arrowd77712)"/><text x="930" y="210" font-size="23" fill="#142a49" font-weight="400" text-anchor="start">保留本轮证据</text><text x="70" y="345" font-size="28" fill="#d77712" font-weight="600" text-anchor="start">轮次／调用上限</text><path d="M345,335 L430,335" fill="none" stroke="#d77712" stroke-width="3" marker-end="url(#s9-arrowd77712)"/><text x="460" y="345" font-size="26" fill="#142a49" font-weight="400" text-anchor="start">停止自动推进</text><path d="M830,335 L900,335" fill="none" stroke="#d77712" stroke-width="3" marker-end="url(#s9-arrowd77712)"/><text x="930" y="345" font-size="23" fill="#142a49" font-weight="400" text-anchor="start">保留停止原因</text><text x="70" y="480" font-size="28" fill="#d77712" font-weight="600" text-anchor="start">环境／证据异常</text><path d="M345,470 L430,470" fill="none" stroke="#d77712" stroke-width="3" marker-end="url(#s9-arrowd77712)"/><text x="460" y="480" font-size="26" fill="#142a49" font-weight="400" text-anchor="start">按规则阻塞或暂停</text><path d="M830,470 L900,470" fill="none" stroke="#d77712" stroke-width="3" marker-end="url(#s9-arrowd77712)"/><text x="930" y="480" font-size="23" fill="#142a49" font-weight="400" text-anchor="start">形成待人工移交材料</text><text x="70" y="580" font-size="24" fill="#142a49" font-weight="400" text-anchor="start">移交内容：原因 · 版本 · 证据路径 · 消耗 · 下一步建议</text>
    <text x="64" y="651" font-size="17" fill="#6b788b" font-weight="400" text-anchor="start">离线受控验证已有；真实专项待补。待人工处理不表示已经有人接手</text>
